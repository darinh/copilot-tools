[project]
name = "copilot-tools"
dynamic = ["version"]
description = "Tools, skills, and workflow conventions for GitHub Copilot CLI power users"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[project.scripts]
operator = "copilot_operator:main"
handoff = "handoff_tool:main"
operator-ingest = "operator_ingest:main"
operator-runner = "operator_runner:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=64"]
# A thin wrapper around `setuptools.build_meta` that refuses to produce an
# *editable* install when the source directory is a linked git worktree. Every
# agent on this project works in one, and `pip install -e .` from a worktree
# repoints this interpreter's console scripts at a directory whose purpose is
# to be deleted -- which has taken out `operator` and `handoff` machine-wide
# twice. See worktree_guard_backend.py for the full argument.
build-backend = "worktree_guard_backend"
backend-path = ["."]

[tool.setuptools]
py-modules = [
    "copilot_operator",
    "copilot_tools_version",
    "install_manifest",
    "operator_console",
    "operator_ingest",
    "operator_mail",
    "operator_mux",
    "operator_runner",
    "handoff_tool",
    "project_paths",
    "setup_tools",
    "worktree_guard_backend",
]

# The version lives in one module so packaging metadata and the install
# manifest cannot disagree about what is installed.
[tool.setuptools.dynamic]
version = { attr = "copilot_tools_version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is on the path deliberately, not by accident of the default
# import mode. The conformance scans share their AST helpers by importing
# one another, and under `--import-mode=importlib` pytest stops prepending
# the rootdir of a test file to `sys.path` -- so that sharing would become a
# collection-time `ModuleNotFoundError` the day someone passes that flag.
# One line here says the arrangement is intended and makes it survive.
pythonpath = ["tests"]
