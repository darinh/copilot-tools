name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The integration tests need a real multiplexer. They skip themselves
      # when one is absent, so installing it here is what makes them run.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install psmux (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.3.7'
          $url = "https://github.com/psmux/psmux/releases/download/v$version/psmux-v$version-windows-x64.zip"
          $zip = "$env:RUNNER_TEMP\psmux.zip"
          $dest = "$env:RUNNER_TEMP\psmux"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter 'psmux.exe' -Recurse | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Verify multiplexer
        run: python -c "from operator_mux import Mux; m=Mux(); print('backend:', m.binary, m.version())"

      - name: Run tests
        run: python -m pytest tests/ -v

      # Stdlib-only smoke test. Runs the same paths without pytest, so it also
      # works in environments where installing test dependencies is not possible.
      - name: Cross-platform verification
        run: python verify_cross_platform.py

      - name: Verify console scripts
        run: |
          operator version
          operator help

  shellcheck:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all shell scripts
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "FAIL $f"; status=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $status

      # Functional coverage for setup.sh's legacy-migration logic. It runs in
      # throwaway sandboxes (fake HOME + fake checkout) with a stub
      # setup_tools.py, so it never touches the runner's real ~/.local/bin.
      - name: setup.sh migration tests
        timeout-minutes: 10
        run: bash tests/test_setup_sh.sh

  extensions:
    # extensions/ ships JavaScript that runs inside every Copilot session on a
    # developer's machine, and until this job existed no part of the pipeline
    # ever loaded it. Every file could have been syntactically invalid and the
    # whole matrix would still have been green.
    name: Extension syntax and logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: node --check every extension
        run: |
          status=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "FAIL $f"; status=1; }
          done < <(find extensions -name '*.mjs' -print0)
          exit $status

      - name: checkout-guard unit and integration tests
        timeout-minutes: 5
        run: node --test extensions/checkout-guard/guard.test.mjs

  git-identity:
    # Purging one accidentally-committed corporate address from this
    # repository cost a full history rewrite AND the deletion and recreation
    # of the GitHub remote, because refs/pull/* kept the address alive through
    # the rewrite. The repository is public, so the gap between a push and a
    # discovery is publication, and an identity mistake is one of the few
    # defects here that cannot be fixed forward. Until this job existed the
    # rule "every commit uses darinh@gmail.com" was enforced by whoever
    # remembered it -- and the address originally came from a different
    # machine's global config, which is exactly when nobody does.
    name: Commit identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Load-bearing, and the reason this is a separate job rather than a
          # step in one of the others: every job above checks out at the
          # default depth of 1. A history scan run there would examine the tip
          # commit, certify the hundreds behind it, and report that in green
          # forever. git_identity.py refuses a shallow clone with exit 2
          # rather than passing, so removing this line turns the job red
          # instead of silent -- but it is still the line that makes the job
          # mean anything.
          fetch-depth: 0

      - name: Every commit uses an allowed identity
        run: python3 git_identity.py

