name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      # Full history, not the default depth-1 clone. backlog_tool's R8 rule
      # resolves the `commit:` sha of every closed item with `git cat-file`,
      # and in a shallow clone no commit but the tip exists -- so the rule
      # reported every correctly-closed item as naming a commit that "does not
      # resolve to a commit in this repository". The check cannot tell "this
      # sha is bogus" from "I was only given one commit to look at", and the
      # shallow clone made the second reading permanent on CI while every
      # local run passed. Fetching the history restores the guarantee; making
      # the rule tolerate a shallow clone would have retired it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The integration tests need a real multiplexer. They skip themselves
      # when one is absent, so installing it here is what makes them run.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install psmux (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.3.7'
          $url = "https://github.com/psmux/psmux/releases/download/v$version/psmux-v$version-windows-x64.zip"
          $zip = "$env:RUNNER_TEMP\psmux.zip"
          $dest = "$env:RUNNER_TEMP\psmux"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter 'psmux.exe' -Recurse | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Verify multiplexer
        run: python -c "from operator_mux import Mux; m=Mux(); print('backend:', m.binary, m.version())"

      - name: Run tests
        run: python -m pytest tests/ -v

      # Stdlib-only smoke test. Runs the same paths without pytest, so it also
      # works in environments where installing test dependencies is not possible.
      - name: Cross-platform verification
        run: python verify_cross_platform.py

      - name: Verify console scripts
        run: |
          operator version
          operator help

  shellcheck:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all shell scripts
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "FAIL $f"; status=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $status

      # Functional coverage for setup.sh's legacy-migration logic. It runs in
      # throwaway sandboxes (fake HOME + fake checkout) with a stub
      # setup_tools.py, so it never touches the runner's real ~/.local/bin.
      - name: setup.sh migration tests
        timeout-minutes: 10
        run: bash tests/test_setup_sh.sh

      # The parallel-agent claim protocol, executed rather than read.
      # tests/test-todo-claims.sh was committed and then run by nothing for as
      # long as it existed: `bash -n` above parsed it on every push, which is
      # why it never looked broken, and a parse is not an execution. Its
      # assertions had never once run in CI.
      # tests/test_shell_tests_are_executed.py now fails if any tests/*.sh
      # loses its run step again -- and it parses this file rather than
      # grepping it, so naming the script in this comment cannot stand in for
      # the step below.
      #
      # sqlite3 is present on the GitHub-hosted ubuntu images, so the install
      # is a fallback rather than the normal path -- but the script exits 1
      # when sqlite3 is missing, and a hard failure on an image change is a
      # worse outcome than one conditional apt-get.
      - name: todo-claim protocol tests
        timeout-minutes: 5
        run: |
          command -v sqlite3 >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y sqlite3
          }
          bash tests/test-todo-claims.sh

  extensions:
    # extensions/ ships JavaScript that runs inside every Copilot session on a
    # developer's machine, and until this job existed no part of the pipeline
    # ever loaded it. Every file could have been syntactically invalid and the
    # whole matrix would still have been green.
    name: Extension syntax and logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: node --check every extension
        run: |
          status=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "FAIL $f"; status=1; }
          done < <(find extensions -name '*.mjs' -print0)
          exit $status

      - name: checkout-guard unit and integration tests
        timeout-minutes: 5
        run: node --test extensions/checkout-guard/guard.test.mjs

